title: Example - Suspicious PowerShell Command Execution
id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
status: test
description: This is an example Sigma rule that detects suspicious PowerShell command execution with encoding or obfuscation techniques
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://github.com/SigmaHQ/sigma
author: Example Author
date: 2024/12/18
modified: 2024/12/18
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - '-enc'
            - '-encodedcommand'
            - '-nop'
            - '-noprofile'
            - 'bypass'
    condition: selection
falsepositives:
    - Legitimate administrative scripts
    - Software deployment tools
    - System management tools
level: medium
fields:
    - CommandLine
    - User
    - ParentImage
